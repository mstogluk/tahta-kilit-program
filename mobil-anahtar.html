<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tahta Kilit - Mobil Anahtar</title>
<style>
  body {
    margin: 0; padding: 24px; box-sizing: border-box;
    background: #0d0d12; color: #eee;
    font-family: -apple-system, Roboto, Segoe UI, sans-serif;
    text-align: center;
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .kutu {
    background: #1a1a22; border-radius: 14px; padding: 20px;
    margin: 16px auto; max-width: 380px;
  }
  input {
    width: 100%; box-sizing: border-box; padding: 12px; font-size: 16px;
    border-radius: 8px; border: 1px solid #444; background: #111; color: #eee;
    text-align: center; margin-top: 8px;
  }
  button {
    width: 100%; padding: 14px; font-size: 16px; margin-top: 12px;
    border-radius: 8px; border: none; background: #4a7fff; color: white;
    font-weight: 600; cursor: pointer;
  }
  button.ikincil { background: #333; }
  #kod {
    font-size: 48px; font-weight: 700; letter-spacing: 6px;
    color: #4ade80; margin: 12px 0;
  }
  #geriSayim { font-size: 13px; color: #888; }
  #kamera { width: 100%; border-radius: 8px; margin-top: 12px; display: none; }
  .hata { color: #ff6b6b; font-size: 14px; }
  .gizli { display: none; }
</style>
</head>
<body>

<h1>Tahta Kilit — Mobil Anahtar</h1>

<div id="kurulumEkrani" class="kutu">
  <p>İlk kullanım: admin'in sana verdiği karekodu tara (ya da elle gir).</p>
  <button onclick="kameraAc('kurulum')">Karekod Tara</button>
  <input id="gizliGiris" placeholder="ya da elle gir">
  <button class="ikincil" onclick="gizliKaydet()">Kaydet</button>
  <p id="kurulumHata" class="hata"></p>
</div>

<div id="anaEkran" class="kutu gizli">
  <p id="ogretmenBaslik" style="color:#888;font-size:13px;"></p>
  <p>Tahtadaki karekodu tara:</p>
  <button onclick="kameraAc('kullanim')">Karekodu Tara</button>
  <input id="tahtaVerisiGiris" placeholder="ya da elle gir: tahta_id:nonce">
  <button class="ikincil" onclick="tahtaVerisiManuelOnayla()">Kod Üret</button>

  <div id="kodBolumu" class="gizli">
    <p style="font-size:13px;color:#888;">Bu kodu tahtaya girin:</p>
    <div id="kod">---------</div>
  </div>

  <button class="ikincil" onclick="anahtarSifirla()">Anahtarı değiştir</button>
</div>

<video id="kamera" autoplay playsinline muted class="kutu"></video>

<script>
// ---- Base32 decode (RFC 4648) ----
function base32Decode(str) {
  const alf = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  str = str.replace(/=+$/, "").toUpperCase().replace(/[^A-Z2-7]/g, "");
  let bits = "", bytes = [];
  for (const c of str) {
    const v = alf.indexOf(c);
    if (v === -1) continue;
    bits += v.toString(2).padStart(5, "0");
  }
  for (let i = 0; i + 8 <= bits.length; i += 8) {
    bytes.push(parseInt(bits.substr(i, 8), 2));
  }
  return new Uint8Array(bytes);
}

// ---- SHA-1 (saf JS, secure-context gerektirmez) ----
function sha1(bytes) {
  function rotl(n, s) { return (n << s) | (n >>> (32 - s)); }
  let msg = Array.from(bytes);
  const origLenBits = msg.length * 8;
  msg.push(0x80);
  while (msg.length % 64 !== 56) msg.push(0);
  for (let i = 7; i >= 0; i--) msg.push((origLenBits / Math.pow(2, i * 8)) & 0xff);

  let h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;

  for (let chunk = 0; chunk < msg.length; chunk += 64) {
    const w = new Array(80);
    for (let i = 0; i < 16; i++) {
      w[i] = (msg[chunk + i*4] << 24) | (msg[chunk + i*4+1] << 16) |
             (msg[chunk + i*4+2] << 8) | (msg[chunk + i*4+3]);
    }
    for (let i = 16; i < 80; i++) w[i] = rotl(w[i-3] ^ w[i-8] ^ w[i-14] ^ w[i-16], 1);

    let a = h0, b = h1, c = h2, d = h3, e = h4;
    for (let i = 0; i < 80; i++) {
      let f, k;
      if (i < 20) { f = (b & c) | (~b & d); k = 0x5A827999; }
      else if (i < 40) { f = b ^ c ^ d; k = 0x6ED9EBA1; }
      else if (i < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; }
      else { f = b ^ c ^ d; k = 0xCA62C1D6; }
      const temp = (rotl(a, 5) + f + e + k + w[i]) >>> 0;
      e = d; d = c; c = rotl(b, 30); b = a; a = temp;
    }
    h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0;
    h3 = (h3 + d) >>> 0; h4 = (h4 + e) >>> 0;
  }
  const out = new Uint8Array(20);
  [h0, h1, h2, h3, h4].forEach((h, i) => {
    out[i*4] = (h >>> 24) & 0xff; out[i*4+1] = (h >>> 16) & 0xff;
    out[i*4+2] = (h >>> 8) & 0xff; out[i*4+3] = h & 0xff;
  });
  return out;
}

function hmacSha1(keyBytes, msgBytes) {
  const blockSize = 64;
  let key = Array.from(keyBytes);
  if (key.length > blockSize) key = Array.from(sha1(new Uint8Array(key)));
  while (key.length < blockSize) key.push(0);
  const oKeyPad = key.map(b => b ^ 0x5c);
  const iKeyPad = key.map(b => b ^ 0x36);
  const inner = sha1(new Uint8Array(iKeyPad.concat(Array.from(msgBytes))));
  return sha1(new Uint8Array(oKeyPad.concat(Array.from(inner))));
}

function strToBytes(str) {
  return new Uint8Array([...str].map(c => c.charCodeAt(0)));
}

// ---- Meydan okuma - cevap (Python keyauth.py ile birebir aynı mantık) ----
function kisaHmac(anahtarBytes, mesajStr, basamak) {
  const h = hmacSha1(anahtarBytes, strToBytes(mesajStr));
  const ofset = h[19] & 0x0f;
  const parca = ((h[ofset] & 0x7f) << 24) | (h[ofset+1] << 16) | (h[ofset+2] << 8) | h[ofset+3];
  return String(parca % Math.pow(10, basamak)).padStart(basamak, "0");
}

function mobilCevapUret(masterB32, ogretmenKodu, nonce) {
  const masterBytes = base32Decode(masterB32);
  const kisiselAnahtar = hmacSha1(masterBytes, strToBytes(ogretmenKodu));
  const cevap = kisaHmac(kisiselAnahtar, nonce, 6);
  return ogretmenKodu + cevap;
}

// ---- Sayfa mantığı ----
let stream = null;

function kayitliMi() {
  return !!localStorage.getItem("mobil_gizli") && !!localStorage.getItem("ogretmen_kodu");
}

function ekranlariGuncelle() {
  document.getElementById("kurulumEkrani").classList.toggle("gizli", kayitliMi());
  document.getElementById("anaEkran").classList.toggle("gizli", !kayitliMi());
  if (kayitliMi()) {
    const adi = localStorage.getItem("ogretmen_adi") || "";
    document.getElementById("ogretmenBaslik").textContent =
      adi ? `${adi} (kod: ${localStorage.getItem("ogretmen_kodu")})` : `Öğretmen kodu: ${localStorage.getItem("ogretmen_kodu")}`;
  }
}

// Admin'den gelen kurulum verisi format: mobil_gizli|ogretmen_kodu|ogretmen_adi
function kurulumVerisiniIsle(deger) {
  const parcalar = deger.split("|");
  if (parcalar.length < 2) {
    document.getElementById("kurulumHata").textContent = "Geçersiz kurulum verisi";
    return;
  }
  localStorage.setItem("mobil_gizli", parcalar[0]);
  localStorage.setItem("ogretmen_kodu", parcalar[1]);
  if (parcalar[2]) localStorage.setItem("ogretmen_adi", parcalar[2]);
  ekranlariGuncelle();
}

function gizliKaydet() {
  const deger = document.getElementById("gizliGiris").value.trim();
  if (!deger) {
    document.getElementById("kurulumHata").textContent = "Boş olamaz";
    return;
  }
  kurulumVerisiniIsle(deger);
}

function anahtarSifirla() {
  if (confirm("Kayıtlı anahtarı silmek istediğine emin misin?")) {
    localStorage.removeItem("mobil_gizli");
    localStorage.removeItem("ogretmen_kodu");
    localStorage.removeItem("ogretmen_adi");
    ekranlariGuncelle();
  }
}

function tahtaVerisiManuelOnayla() {
  const deger = document.getElementById("tahtaVerisiGiris").value.trim();
  if (deger) kodUret(deger);
}

// tahtaVerisi format: tahta_id:nonce
function kodUret(tahtaVerisi) {
  kameraKapat();
  const ikiNokta = tahtaVerisi.indexOf(":");
  if (ikiNokta === -1) {
    alert("Geçersiz tahta verisi");
    return;
  }
  const nonce = tahtaVerisi.slice(ikiNokta + 1);
  const gizli = localStorage.getItem("mobil_gizli");
  const ogretmenKodu = localStorage.getItem("ogretmen_kodu");
  const kod = mobilCevapUret(gizli, ogretmenKodu, nonce);
  document.getElementById("kodBolumu").classList.remove("gizli");
  document.getElementById("kod").textContent = kod;
}

// ---- Kamera ile QR tarama (BarcodeDetector API, ek kütüphane yok) ----
// mod: 'kurulum' -> taranan değer gizli anahtar olarak kaydedilir
//      'kullanim' -> taranan değer tahta kimliği olarak kullanılır
async function kameraAc(mod) {
  if (!("BarcodeDetector" in window)) {
    alert("Bu tarayıcı otomatik tarama desteklemiyor, elle gir.");
    return;
  }
  const video = document.getElementById("kamera");
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
  } catch (e) {
    alert("Kameraya erişilemedi: " + e.message);
    return;
  }
  video.srcObject = stream;
  video.style.display = "block";
  const detector = new BarcodeDetector({ formats: ["qr_code"] });

  const taramaAdimi = async () => {
    if (!stream) return;
    try {
      const kodlar = await detector.detect(video);
      if (kodlar.length > 0) {
        const deger = kodlar[0].rawValue;
        kameraKapat();
        if (mod === "kurulum") {
          kurulumVerisiniIsle(deger);
        } else {
          kodUret(deger);
        }
        return;
      }
    } catch (e) { /* frame hazir degilse yoksay */ }
    requestAnimationFrame(taramaAdimi);
  };
  requestAnimationFrame(taramaAdimi);
}

function kameraKapat() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  document.getElementById("kamera").style.display = "none";
}

ekranlariGuncelle();
</script>
</body>
</html>
